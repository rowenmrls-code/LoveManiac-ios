workflows:
  ios-unsigned:
    name: Build Unsigned IPA
    instance_type: mac_mini_m2
    scripts:
      - name: Download and Unzip Project
        script: |
          curl -L "https://pixeldrain.com/api/file/VAVc3Wxo" -o project.zip
          unzip -q project.zip
          if [ -d "LoveManiac_iOS" ]; then mv LoveManiac_iOS/* .; fi
      - name: Build Xcode Project
        script: |
          xcodebuild -project LoveManiac.xcodeproj \
            -scheme LoveManiac \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
      - name: Package IPA
        script: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/*.app Payload/
          zip -r LoveManiac.ipa Payload
    artifacts:
      - LoveManiac.ipa




