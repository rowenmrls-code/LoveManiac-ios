workflows:
  ios-unsigned:
    name: Build Unsigned IPA
    instance_type: mac_mini_m2
    scripts:
      - name: Download and Unzip Project
        script: |
          curl -L "https://github.com/rowenmrls-code/LoveManiac-ios/releases/download/v1.0/LoveManiac_iOS.tar.gz" -o project.tar.gz
          tar -xf project.tar.gz
      - name: Build Xcode Project
        script: |
          PROJ=$(find . -maxdepth 3 -name "*.xcodeproj" | head -n 1)
          SCHEME=$(basename "$PROJ" .xcodeproj)
          echo "Found project: $PROJ (scheme: $SCHEME)"
          xcodebuild -project "$PROJ" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
      - name: Package IPA
        script: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/*.app Payload/
          zip -r LoveManiac.ipa Payload
    artifacts:
      - LoveManiac.ipa

