workflows:
  ios-unsigned:
    name: Build Unsigned IPA
    instance_type: mac_mini_m2
    scripts:
      - name: Download and Unzip Project
        script: |
          TOKEN=$(curl -s -X POST https://api.gofile.io/accounts | python3 -c "import sys, json; print(json.load(sys.stdin)['data']['token'])")
          LINK=$(curl -s -H "Authorization: Bearer $TOKEN" "https://api.gofile.io/contents/ZXjKhJ2p?wt=4fd6sg89d7s6" | python3 -c "import sys, json; data=json.load(sys.stdin)['data']['children']; print(list(data.values())[0]['link'])")
          curl -L -H "Cookie: accountToken=$TOKEN" "$LINK" -o project.zip
          tar -xf project.zip
      - name: Build Xcode Project
        script: |
          PROJ=$(find . -maxdepth 3 -name "*.xcodeproj" | head -n 1)
          SCHEME=$(basename "$PROJ" .xcodeproj)
          echo "Found project: $PROJ (scheme: $SCHEME)"
          xcodebuild -project "$PROJ" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
      - name: Package IPA
        script: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/*.app Payload/
          zip -r LoveManiac.ipa Payload
    artifacts:
      - LoveManiac.ipa

